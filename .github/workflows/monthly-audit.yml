name: Monthly Dependency Audit

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  audit:
    name: Comprehensive Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --json > audit-report.json || true

      - name: Check outdated packages
        run: pnpm outdated --json > outdated-report.json || true

      - name: Generate summary
        run: node tests/monthly-audit.mjs

      - name: Upload audit summary
        uses: actions/upload-artifact@v4
        with:
          name: monthly-audit
          path: |
            audit-summary.md
            audit-report.json
            outdated-report.json

      - name: Create issue on findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().toISOString().slice(0, 7);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["security", "audit"],
            });
            const existing = issues.find((i) => i.title.includes(month));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Monthly audit: vulnerabilities found - ${month}`,
                labels: ["security", "audit"],
                body: `Monthly dependency audit found critical or high vulnerabilities. See workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
