name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create Cloudflare Pages project if not exists
        continue-on-error: true
        run: npx wrangler pages project create sebastianweszler-com --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add custom domain sebastianweszler.com via API
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/sebastianweszler-com/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"sebastianweszler.com"}')
          echo "$RESPONSE" | jq '.'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Get Cloudflare zone and upsert DNS
        continue-on-error: true
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=sebastianweszler.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
          
          if [ -z "$ZONE_ID" ]; then 
            echo "No zone found for sebastianweszler.com or token lacks permissions."
            exit 0
          fi

          echo "Zone ID: $ZONE_ID"

          # Delete existing A/AAAA records at apex
          for rtype in A AAAA; do
            for rid in $(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=$rtype&name=sebastianweszler.com" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[].id'); do
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$rid" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            done
          done

          # Upsert CNAME
          RECORD_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=sebastianweszler.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')

          if [ -n "$RECORD_ID" ]; then
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"sebastianweszler.com","content":"sebastianweszler-com.pages.dev","proxied":true}' | jq '.'
          else
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"sebastianweszler.com","content":"sebastianweszler-com.pages.dev","proxied":true}' | jq '.'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=sebastianweszler-com

      - name: Install Playwright for E2E Tests
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: node tests/e2e.mjs
        env:
          BASE_URL: https://sebastianweszler-com.pages.dev/
