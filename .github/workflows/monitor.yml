name: Daily Monitoring

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  uptime:
    name: Uptime Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run uptime check
        run: node tests/uptime-check.mjs
        env:
          SITE_URL: https://sebastianweszler-com.pages.dev
          SECONDARY_SITE: https://sebastianweszler.com

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["monitoring"],
            });
            const today = new Date().toISOString().slice(0, 10);
            const existing = issues.find((i) => i.title.includes(today));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Monitoring failure - ${today}`,
                labels: ["monitoring"],
                body: `Daily uptime check failed for ${today}. Check workflow logs for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

  web-vitals:
    name: Core Web Vitals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Lighthouse CI
        run: pnpm add -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          mkdir -p lhci-reports
          lhci collect --url=https://sebastianweszler-com.pages.dev/ --number-of-runs=3
          lhci assert --config=.lighthouseci/lighthouserc.json 2>/dev/null || true
          lhci upload --target=filesystem --output-dir=./lhci-reports/ || true

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lhci-reports/
